services:
  postgres:
    image: postgres:17-alpine
    container_name: chronicles-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-chronicles}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chronicles}
      POSTGRES_DB: ${DB_DATABASE:-chronicles}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-chronicles} -d ${DB_DATABASE:-chronicles}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
